name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK and create checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Dynamic-Island.apk
          sha256sum app/build/outputs/apk/debug/Dynamic-Island.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Publish direct APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dynamic Island build ${{ github.run_number }}
          body: |
            Automatically built Android debug APK.
            Download Dynamic-Island.apk directly below. No ZIP extraction is needed.
            SHA-256 checksum is provided as a separate file.
          files: |
            app/build/outputs/apk/debug/Dynamic-Island.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          fail_on_unmatched_files: true
